aid: welltheory
name: WellTheory
description: >-
  WellTheory is a virtual autoimmune care platform that provides whole-person
  support for people living with autoimmune and inflammatory conditions,
  pairing members with a dedicated care team for nutrition, lifestyle, and
  clinical guidance across more than 100 conditions. The company sells to
  employers and health plans as a covered benefit as well as direct to
  consumers, and is backed by Accel and General Catalyst. WellTheory publishes
  no public developer API surface today; its api.welltheory.com backend and
  docs are private/internal.
